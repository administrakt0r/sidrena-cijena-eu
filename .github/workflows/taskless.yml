name: Taskless

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Taskless check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: .taskless/.cache
          key: ${{ runner.os }}-taskless-${{ hashFiles('.taskless/bin/cli.lock.json') }}

      - name: Run Taskless check
        run: node .taskless/bin/cli.mjs check
