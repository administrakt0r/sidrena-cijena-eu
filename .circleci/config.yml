version: 2.1

commands:
  restore_tool_caches:
    description: "Restore Composer, NPM, and static analysis caches"
    steps:
      - restore_cache:
          name: Restore Composer cache
          keys:
            - v1-composer-{{ checksum "composer.lock" }}
            - v1-composer-{{ checksum "composer.json" }}
            - v1-composer-
      - restore_cache:
          name: Restore NPM cache
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
            - v1-npm-{{ checksum "package.json" }}
            - v1-npm-
      - restore_cache:
          name: Restore Static Analysis and Test caches
          keys:
            - v1-analysis-{{ .Branch }}-{{ .Revision }}
            - v1-analysis-{{ .Branch }}-
            - v1-analysis-

  save_tool_caches:
    description: "Save Composer and NPM caches"
    steps:
      - save_cache:
          name: Save Composer cache
          key: v1-composer-{{ checksum "composer.lock" }}
          paths:
            - ~/.cache/composer
            - vendor
      - save_cache:
          name: Save NPM cache
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules

  save_analysis_caches:
    description: "Save Static Analysis and Test caches (PHPCS, PHPStan, ESLint, PHPUnit)"
    steps:
      - save_cache:
          name: Save Static Analysis and Test caches
          key: v1-analysis-{{ .Branch }}-{{ .Revision }}
          paths:
            - .phpcs.cache
            - .phpstan.cache
            - .eslintcache
            - .phpunit.result.cache

  restore_playwright_cache:
    description: "Restore Playwright browser binaries cache"
    steps:
      - restore_cache:
          name: Restore Playwright browser binaries cache
          keys:
            - v1-playwright-{{ checksum "package-lock.json" }}
            - v1-playwright-

  save_playwright_cache:
    description: "Save Playwright browser binaries cache"
    steps:
      - save_cache:
          name: Save Playwright browser binaries cache
          key: v1-playwright-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/ms-playwright

jobs:
  verify:
    description: "Run static quality gates (unit tests, PHPCS, PHPStan, ESLint, translations completeness)"
    docker:
      - image: cimg/php:8.4-node
    resource_class: medium
    steps:
      - checkout
      - restore_tool_caches
      - run:
          name: Install Composer Dependencies
          command: composer install --prefer-dist --no-progress
      - run:
          name: Install NPM Dependencies
          command: npm ci || npm install
      - save_tool_caches
      - run:
          name: PHPUnit Unit Tests
          command: composer test:unit
      - run:
          name: PHPCS WordPress Coding Standards
          command: composer lint
      - run:
          name: PHPStan Static Analysis (Level 6)
          command: composer analyse
      - run:
          name: ESLint JavaScript Check
          command: npm run lint:js
      - run:
          name: Croatian Catalog Completeness Check
          command: |
            OUT=$(php tools/i18n/make-pot.php --locale=hr_HR 2>&1)
            echo "$OUT"
            echo "$OUT" | grep -q "0 untranslated" || (echo "Untranslated strings found in catalog!" && exit 1)
      - save_analysis_caches

  integration_and_e2e:
    description: "Run WordPress integration tests and Playwright E2E tests using wp-env"
    working_directory: ~/titanworks-bazna-cijena
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Setup PHP 8.4 and Node 20
          command: |
            if ! command -v php >/dev/null || ! php -v | grep -q "8.4"; then
              sudo add-apt-repository -y ppa:ondrej/php
              sudo apt-get update
              sudo apt-get install -y php8.4-cli php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip composer
            fi
            nvm install 20
            nvm use 20
            echo 'nvm use 20' >> "$BASH_ENV"
      - restore_tool_caches
      - restore_playwright_cache
      - run:
          name: Install Dependencies
          command: |
            composer install --prefer-dist --no-progress
            npm ci || npm install
            npx playwright install --with-deps chromium
      - save_tool_caches
      - save_playwright_cache
      - run:
          name: Start wp-env
          command: |
            for attempt in 1 2 3; do
              echo "Starting wp-env (attempt $attempt)..."
              if npx wp-env start; then
                echo "wp-env started successfully!"
                break
              fi
              echo "wp-env start attempt $attempt failed; waiting 12s for database container to initialize..."
              sleep 12
            done
      - run:
          name: Run PHPUnit Integration Tests in wp-env
          command: |
            npx wp-env clean tests
            npx wp-env run tests-cli -- bash -c 'PHPUNIT=$(find wp-content/plugins -name phpunit -type f | grep "vendor/bin/phpunit" | head -n 1); $PHPUNIT -c $(dirname $(dirname $(dirname "$PHPUNIT")))/phpunit.xml.dist --testsuite=integration'
      - run:
          name: Run Playwright E2E Tests on Port 8889
          command: |
            npm run test:e2e
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  version: 2
  pipeline:
    jobs:
      - verify
      - integration_and_e2e
