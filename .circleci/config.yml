version: 2.1

commands:
  dependency_keys:
    steps:
      - run:
          name: Fingerprint dependencies (ignore release-only version changes)
          command: node tools/ci/cache-keys.cjs

  restore_node_cache:
    parameters:
      executor:
        type: string
    steps:
      - restore_cache:
          name: Restore installed Node dependencies
          keys:
            - v3-node-<< parameters.executor >>-{{ checksum ".circleci/cache-keys/runtime" }}-{{ checksum ".circleci/cache-keys/npm" }}
            # A download-only fallback is safe across Node versions and executors.
            - v2-npm-{{ checksum "package-lock.json" }}
            - v2-npm-
      - run:
          name: Install Node dependencies only on a cache miss
          command: |
            if [ ! -f node_modules/.package-lock.json ]; then
              npm ci --no-audit --no-fund
            fi

  save_node_cache:
    parameters:
      executor:
        type: string
    steps:
      - save_cache:
          name: Cache installed Node dependencies
          key: v3-node-<< parameters.executor >>-{{ checksum ".circleci/cache-keys/runtime" }}-{{ checksum ".circleci/cache-keys/npm" }}
          paths:
            - node_modules

  restore_analysis_cache:
    steps:
      - restore_cache:
          name: Restore incremental analysis results
          keys:
            - v3-analysis-{{ checksum "composer.lock" }}-{{ .Branch }}-{{ .Revision }}
            - v3-analysis-{{ checksum "composer.lock" }}-{{ .Branch }}-
            - v3-analysis-{{ checksum "composer.lock" }}-main-
            - v2-analysis-{{ .Branch }}-
            - v2-analysis-

jobs:
  verify:
    description: "Cheap quality gate; the WordPress VM starts only after this succeeds"
    docker:
      - image: cimg/php:8.4-node
    resource_class: medium
    retention:
      caches: 7d
    steps:
      - checkout
      - dependency_keys
      - restore_cache:
          name: Restore installed Composer dependencies
          keys:
            - v3-php84-vendor-{{ checksum "composer.lock" }}
            - v2-composer-{{ checksum "composer.lock" }}
            - v2-composer-
      - run:
          name: Validate Composer dependencies and regenerate autoload paths
          command: composer install --prefer-dist --no-progress --no-interaction
      - save_cache:
          name: Cache installed Composer dependencies
          key: v3-php84-vendor-{{ checksum "composer.lock" }}
          paths:
            - vendor
            - ~/.cache/composer
      - restore_node_cache:
          executor: verify
      - save_node_cache:
          executor: verify
      - restore_analysis_cache
      - run:
          name: CI helper regression checks
          command: node --test tools/ci/test-helpers.cjs
      - run:
          name: PHPUnit Unit Tests
          command: composer test:unit
      - run:
          name: PHPCS WordPress Coding Standards
          command: composer lint
      - run:
          name: PHPStan Static Analysis (Level 6)
          command: composer analyse -- --memory-limit=2048M
      - run:
          name: ESLint JavaScript Check
          command: npm run lint:js
      - run:
          name: Taskless Rules Check
          command: node .taskless/bin/cli.mjs check
      - run:
          name: Croatian Catalog Completeness Check
          command: |
            OUT=$(php tools/i18n/make-pot.php --locale=hr_HR 2>&1)
            echo "$OUT"
            echo "$OUT" | grep -q "0 untranslated" || (echo "Untranslated strings found in catalog!" && exit 1)
      - save_cache:
          name: Save incremental analysis results
          key: v3-analysis-{{ checksum "composer.lock" }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .phpcs.cache
            - .phpstan.cache
            - .eslintcache
            - .phpunit.result.cache
            - .taskless/.cache
      - persist_to_workspace:
          root: .
          paths:
            # Pure PHP tooling is shared; native Node modules stay executor/ABI-specific.
            - vendor

  integration_and_e2e:
    description: "Full WordPress/Playwright/package coverage after verification succeeds"
    working_directory: ~/titanworks-bazna-cijena
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    retention:
      caches: 7d
    steps:
      - checkout
      - run:
          name: Avoid the WordPress setup for documentation-only branches
          command: |
            if bash tools/ci/integration-required.sh; then
              exit 0
            else
              result=$?
              if [ "$result" -eq 10 ]; then
                circleci-agent step halt
              else
                exit "$result"
              fi
            fi
      - attach_workspace:
          at: .
      - run:
          name: Use existing Node 20 (PHP tooling comes from the verified workspace)
          command: |
            nvm use 20 || { nvm install 20 && nvm use 20; }
            NODE_BIN="$(dirname "$(command -v node)")"
            printf 'export PATH=%q:$PATH\n' "$NODE_BIN" >> "$BASH_ENV"
      - dependency_keys
      - restore_node_cache:
          executor: machine
      - save_node_cache:
          executor: machine
      - restore_cache:
          name: Restore Chromium headless shell
          keys:
            - v3-chromium-{{ arch }}-{{ checksum ".circleci/cache-keys/npm" }}
            - v2-playwright-{{ checksum "package-lock.json" }}
      - run:
          name: Ensure headless Chromium and probe existing OS libraries
          command: |
            ./node_modules/.bin/playwright install chromium --only-shell
            node tools/ci/ensure-browser.cjs
      - save_cache:
          name: Cache Chromium headless shell
          key: v3-chromium-{{ arch }}-{{ checksum ".circleci/cache-keys/npm" }}
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: Start wp-env and resolve the existing CLI container
          command: bash tools/ci/start-wp-env.sh
      - run:
          name: Run PHPUnit Integration Tests in wp-env
          command: |
            ./node_modules/.bin/wp-env clean tests
            ./node_modules/.bin/wp-env run tests-cli -- bash -c 'PHPUNIT=$(find wp-content/plugins -name phpunit -type f | grep "vendor/bin/phpunit" | head -n 1); $PHPUNIT -c $(dirname $(dirname $(dirname "$PHPUNIT")))/phpunit.xml.dist --testsuite=integration'
      - run:
          name: Run all Playwright E2E tests (one worker, one shared database)
          command: npm run test:e2e
      - run:
          name: Check submission package and standalone/WooCommerce activation
          command: |
            git archive --format=zip --prefix=sidrena-cijena-eu/ -o directory-review.zip HEAD titanworks-bazna-cijena.php uninstall.php readme.txt LICENSE src assets templates languages
            ./node_modules/.bin/wp-env run cli wp plugin deactivate titanworks-bazna-cijena
            ./node_modules/.bin/wp-env run cli wp plugin install /var/www/html/wp-content/plugins/titanworks-bazna-cijena/directory-review.zip --activate
            ./node_modules/.bin/wp-env run cli wp plugin install plugin-check --activate
            ./node_modules/.bin/wp-env run cli wp plugin check sidrena-cijena-eu --slug=sidrena-cijena-eu --format=json > plugin-check.json
            if grep -Eq '"type"[[:space:]]*:[[:space:]]*"ERROR"' plugin-check.json; then
              cat plugin-check.json
              exit 1
            fi
            ./node_modules/.bin/wp-env run cli wp eval 'if (!shortcode_exists("twbce_cijena")) { throw new Exception("Plugin did not boot with WooCommerce"); }'
            ./node_modules/.bin/wp-env run cli wp plugin deactivate woocommerce
            ./node_modules/.bin/wp-env run cli wp eval 'if (!post_type_exists("twbce_item") || !shortcode_exists("twbce_cijena")) { throw new Exception("Standalone plugin did not boot"); }'
      - store_artifacts:
          path: plugin-check.json
          destination: plugin-check.json
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  version: 2
  pipeline:
    jobs:
      - verify
      - integration_and_e2e:
          requires:
            - verify
